# The application: an instance of its own in every worktree.
# The project name is unset on purpose: Compose takes it from the directory name. So every worktree
# gets a container, an image and volumes of its own, and `docker compose down` here takes down only
# this application: the shared database is a separate project.
services:
    app:
        build:
            context: .
        restart: on-failure:5
        # Longer than GRACEFUL_SHUTDOWN_TIMEOUT (.env): otherwise SIGKILL arrives before the
        # application has stopped, and the graceful shutdown loses its point.
        stop_grace_period: 20s
        # The migrations run in the same container before the bot starts. node-pg-migrate loads
        # the .ts migrations with its built-in jiti, so no separate transpiler is needed.
        # Nothing waits for the healthcheck of the database: it is brought up separately. If the
        # container starts before the database, the migrations fail, and restart: on-failure
        # brings the container back.
        command: sh -c "npm run migrate -- up && exec npm run dev"
        env_file:
            - .env
        environment:
            # The address of the database is its service name in the shared network.
            # DATABASE_PORT in .env is the port published to the host, needed only for connecting
            # from outside the containers.
            DATABASE_HOST: pgsql
            DATABASE_PORT: 5432
            # The only consumer is node-pg-migrate; the application builds its connection from
            # the separate host/port/user/password fields.
            DATABASE_URL: postgres://${DATABASE_USER_NAME}:${DATABASE_USER_PASSWORD}@pgsql:5432/${DATABASE_NAME}
        volumes:
            - ./src:/app/src
            - ./test:/app/test
            - ./tsconfig.json:/app/tsconfig.json
            - ./tsconfig.check.json:/app/tsconfig.check.json
            - ./migrate.json:/app/migrate.json
            # The hot configuration file: the application polls it and rebuilds the configuration
            # on an edit (docs/architecture/config.md). The bind mount of a single file holds on
            # to the inode: an edit in place arrives, a save through a temporary file with a
            # rename (vim by default) does not. The make targets create the file before compose
            # runs: Docker would create a missing path as a directory owned by root, and the
            # application would fail reading the configuration.
            - ./.runtime.env:/app/.runtime.env
            # Otherwise an edit of the Stryker config would silently miss make mutation until
            # make rebuild, as happens with .mocharc.json.
            - ./stryker.config.mjs:/app/stryker.config.mjs
            # The migrations and their template lie outside src, so they are mounted separately.
            # Otherwise migrate would take their version from the image, and migrate-create would
            # write the new file inside the container, where the host would never see it.
            - ./migrations:/app/migrations
            # The nyc report has to outlive the throwaway container: without the mount lcov
            # disappears together with it. make coverage and make check create the directory.
            - ./coverage:/app/coverage
            # The same for the Stryker reports and the run record (reports/mutation). make
            # mutation creates the directory.
            - ./reports:/app/reports
            - app-tmp:/app/tmp
        networks:
            - db

networks:
    # The network of the project from docker-compose.db.yml: the database goes up before the
    # application.
    db:
        name: telegram-bot-db_default
        external: true

volumes:
    app-tmp:
