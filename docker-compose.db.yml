# База данных: один экземпляр на машину, общий для всех рабочих деревьев.
# Имя проекта фиксировано, чтобы повторный запуск из любого дерева попадал в тот же
# контейнер, а не поднимал вторую базу. Данные лежат в ./tmp/pgsql, который в рабочем
# дереве задачи является симлинком на tmp/pgsql основного дерева.
name: telegram-bot-db

services:
    pgsql:
        image: postgres:18-alpine
        restart: unless-stopped
        env_file:
            - .env
        environment:
            POSTGRES_USER: ${DATABASE_SUPERUSER_NAME}
            POSTGRES_PASSWORD: ${DATABASE_SUPERUSER_PASSWORD}
            TZ: ${DATABASE_TIMEZONE}
            PGTZ: ${DATABASE_TIMEZONE}
            PGDATESTYLE: ${DATABASE_DATE_STYLE}
        ports:
            - ${DATABASE_PORT}:5432
        volumes:
            # postgres:18 хранит кластер в $PGDATA=/var/lib/postgresql/18/docker, а не в
            # /var/lib/postgresql/data, как postgres:14, — монтируется родительский каталог.
            - ./tmp/pgsql:/var/lib/postgresql
            - ./docker/pgsql/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "psql -U \"$$POSTGRES_USER\" -d \"$$DATABASE_NAME\" -c 'SELECT 1' > /dev/null 2>&1"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 30s
