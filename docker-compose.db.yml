# The database: one instance per machine, shared by every worktree.
# The project name is fixed, so a repeated run from any worktree lands in the same container
# instead of bringing up a second database. The data lies in ./tmp/pgsql; in a task worktree it is
# a symlink to tmp/pgsql of the main worktree.
name: telegram-bot-db

services:
    pgsql:
        image: postgres:18-alpine
        restart: unless-stopped
        env_file:
            - .env
        environment:
            POSTGRES_USER: ${DATABASE_SUPERUSER_NAME}
            POSTGRES_PASSWORD: ${DATABASE_SUPERUSER_PASSWORD}
            TZ: ${DATABASE_TIMEZONE}
            PGTZ: ${DATABASE_TIMEZONE}
            PGDATESTYLE: ${DATABASE_DATE_STYLE}
        ports:
            - ${DATABASE_PORT}:5432
        volumes:
            # The parent directory is mounted: postgres:18 keeps the cluster in
            # $PGDATA=/var/lib/postgresql/18/docker, not in /var/lib/postgresql/data as postgres:14
            # did.
            - ./tmp/pgsql:/var/lib/postgresql
            - ./docker/pgsql/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "psql -U \"$$POSTGRES_USER\" -d \"$$DATABASE_NAME\" -c 'SELECT 1' > /dev/null 2>&1"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 30s
