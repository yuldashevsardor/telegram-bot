# Подхватывается автоматически при `docker compose up` и переводит app в dev-режим:
# исходники смонтированы с хоста, приложение перезапускается на изменения.
# Для production-сборки запускайте с `-f docker-compose.yml` (override не подключится).
services:
    app:
        build:
            target: development
        command: npm run dev
        environment:
            ENVIRONMENT: development
        volumes:
            - ./src:/app/src
            - ./test:/app/test
            - ./tsconfig.json:/app/tsconfig.json
            - ./migrate.json:/app/migrate.json
            - app-tmp:/app/tmp
